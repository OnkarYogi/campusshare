apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusshare-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campusshare-frontend
  template:
    metadata:
      labels:
        app: campusshare-frontend
    spec:
      containers:
        - name: frontend
          image: campusshare-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: campusshare-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
